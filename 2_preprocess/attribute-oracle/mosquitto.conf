# Mosquitto broker for the attribute-oracle lab.
#
# This broker exists only to carry MQTT between Zigbee2MQTT and the stage-3 engine
# on an isolated, single-host test network. Anonymous access is therefore enabled
# for convenience; do NOT expose this broker to an untrusted network.

listener 1883
allow_anonymous true

# Persist retained messages (e.g. zigbee2mqtt/bridge/devices) across restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type notice
log_type information
